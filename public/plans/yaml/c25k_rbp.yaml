schemaVersion: 1
id: c25k_rbp
name: Runner's Blueprint Couch to 5K
description: >-
  Runner's Blueprint's 8-week "Couch to 5K" run-walk plan: three workouts a week,
  on days with a rest day between them. Every workout starts with a 5-minute brisk walk and
  ends with a 5-minute cool-down walk. Run at an easy pace, and repeat any week that feels too
  hard.
units: km
source: https://www.runnersblueprint.com/couch-to-5k/
type: 5K
schedule:
