    description: 'Walk briskly for 5 minutes, then run 1 minute, walk 90 seconds to 2 minutes. Repeat 6 times. Walk for 5 minutes to cool down.'
  - title: Rest
  - title: 'Run 1 min / walk 2 min x 8'
    description: 'Walk briskly for 5 minutes, then run 1 minute, walk 2 minutes. Repeat 8 times. Walk for 5 minutes to cool down.'
